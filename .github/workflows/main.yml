# =============================================================================
# Main CI Workflow — build and test
# =============================================================================
#
# TRIGGERS
# --------
#   push (main)             Always build and test everything that lands on main,
#                           including merges of pull requests.
#   pull_request_review     Build and test a pull request once a reviewer has
#                           approved it, so CI minutes are only spent on changes
#                           that a human has already vetted.
#   workflow_dispatch       Manual run for any branch, on demand.
#
# The build is a plain Maven multi-module build: no database, message broker or
# Docker daemon is required because the tests use hand-written fakes.
#
# =============================================================================

name: Main CI

on:
  push:
    branches: [ main ]
  pull_request_review:
    types: [ submitted ]
  workflow_dispatch:

# Cancel superseded runs for the same branch or pull request.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    # For review events, only run when the review is an approval.
    if: >-
      github.event_name != 'pull_request_review' ||
      github.event.review.state == 'approved'
    runs-on: ubuntu-latest

    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          # On review events the default ref is the base branch, so explicitly
          # check out the head commit of the approved pull request.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
